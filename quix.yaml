# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 1.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: MCP server
    application: mcp-server
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    publicAccess:
      enabled: true
      urlPrefix: quix-unified-mcpserver
    variables:
      - name: QUIX_TOKEN
        inputType: Secret
        required: true
        secretKey: API_PAT
      - name: QUIX_BASE_URL
        inputType: FreeText
        value: https://portal-api.demo.quix.io/
  - name: test data
    application: csv-source
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    variables:
      - name: output
        inputType: OutputTopic
        description: Name of the output topic to write into
        required: true
        value: csv-data

# This section describes the Topics of the data pipeline
topics:
  - name: csv-data

# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 1.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: RunLLM MCP Server
    application: runllm-mcp
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    publicAccess:
      enabled: true
      urlPrefix: runllmmcp-quixguru
    variables:
      - name: RUNLLM_API_KEY
        inputType: Secret
        required: true
        secretKey: RUNLLM_API_KEY
      - name: RUNLLM_PIPELINE_ID
        inputType: FreeText
        required: true
        value: 111
  - name: Quix Portal MCP server
    application: mcp-server
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    publicAccess:
      enabled: true
      urlPrefix: quix-unified-mcpserver
    variables:
      - name: QUIX_TOKEN
        inputType: Secret
        required: true
        secretKey: API_PAT
      - name: QUIX_BASE_URL
        inputType: FreeText
        value: https://portal-api.demo.quix.io/
      - name: QUIX_WORKSPACE
        inputType: FreeText
        value: demo-webinarsolarfarm-btestv2
  - name: MCP Quix Streaming Reader
    application: mcp-quix-streaming-reader
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    publicAccess:
      enabled: true
      urlPrefix: mcpquixstreamingreader-6a1
    variables:
      - name: QUIX_PAT_TOKEN
        inputType: Secret
        required: true
        secretKey: API_PAT
  - name: MCP Quix Portal V2
    application: portal-mcp-server-v2
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    publicAccess:
      enabled: true
      urlPrefix: portalmcpserverv2-6fee967
    variables:
      - name: QUIX_TOKEN
        inputType: Secret
        required: true
        secretKey: API_PAT
      - name: QUIX_BASE_URL
        inputType: FreeText
        value: https://portal-api.demo.quix.io/


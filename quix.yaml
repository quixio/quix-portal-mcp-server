# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 1.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: MCP server
    application: mcp-server
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    publicAccess:
      enabled: true
      urlPrefix: mcpserver-2f488f2
    variables:
      - name: QUIX_TOKEN
        inputType: Secret
        required: true
        secretKey: API_PAT
      - name: QUIX_BASE_URL
        inputType: FreeText
        value: https://portal-api.demo.quix.io/


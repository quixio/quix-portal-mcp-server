name: MCP server
language: python
variables:
  - name: QUIX_TOKEN
    inputType: Secret
    multiline: false
    defaultValue: API_PAT
    required: true
  - name: QUIX_BASE_URL
    inputType: FreeText
    multiline: false
    defaultValue: https://portal-api.demo.quix.io/
  - name: QUIX_WORKSPACE
    inputType: FreeText
    multiline: false
    defaultValue: demo-webinarsolarfarm-btestv2
dockerfile: dockerfile
runEntryPoint: main.py
defaultFile: main.py
libraryItemId: starter-transformation

name: MCP_Quix Portal V2
language: python
variables:
  - name: QUIX_TOKEN
    inputType: Secret
    multiline: false
    defaultValue: API_PAT
    required: true
  - name: QUIX_BASE_URL
    inputType: FreeText
    multiline: false
    defaultValue: https://portal-api.demo.quix.io/
  - name: QUIX_WORKSPACE
    inputType: FreeText
    multiline: false
    defaultValue: demo-solarfarmdatageneratordemo-prod
dockerfile: dockerfile
runEntryPoint: main.py
defaultFile: main.py
